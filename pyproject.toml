[project]
name = "omoshiroi2"
version = "0.2.1"
description = "A program for ranking images/media by personal preference using an Elo rating system."
readme = "README.md"
authors = [
    { name = "cynumini", email = "cynumini@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "hydrus-api>=5.3.0",
    "platformdirs>=4.14.2",
    "pyside6>=6.12.0",
    "python-dateutil>=4.0.0",
]

[project.scripts]
omoshiroi2 = "omoshiroi2:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pudb>=2026.1",
    "pytest>=9.2.0",
    "ruff>=0.17.0",
]

[tool.basedpyright]
reportExplicitAny = false
